{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
        <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
          rel="stylesheet">
</head>
<style>
    body {
      overflow-x: hidden;
    }

    #sidebar {
      width: 250px;
      height: 100vh;
      transition: all 0.3s;
    }

    #sidebar.collapsed {
      width: 80px;
    }

    #sidebar .nav-link span {
      transition: opacity 0.3s;
    }


    #content {
      width: 100%;
    }
    
  </style>
  <style>
#sidebar {
    width: 250px;
    transition: all 0.3s ease;
}

#sidebar.collapsed {
    width: 80px;
}

/* Hide text when collapsed */
#sidebar.collapsed .menu-text {
    display: none;
}

/* Center icons when collapsed */
#sidebar.collapsed .nav-link {
    justify-content: center;
}

/* Optional: center toggle icon */
#sidebar.collapsed button {
    text-align: center;
}
</style>
  
<body style="background-color: #F5F5F5;">
    <div class="d-flex">

       <!-- Sidebar -->
<div id="sidebar" class="bg-white p-3">

    <!-- Toggle -->
    <button class="btn btn-outline-dark w-100 mb-3" onclick="toggleSidebar()">
        ☰
    </button>

    <!-- Menu -->
    <ul class="nav nav-pills flex-column">

        <li class="nav-item">
            <a href="#" class="nav-link text-black d-flex align-items-center gap-2">
                <span class="material-symbols-outlined">pets</span> 
                <span class="menu-text">Animal Bite</span>
            </a>
        </li>

        <li class="nav-item">
            <a href="#" class="nav-link text-black d-flex align-items-center gap-2">
                <span class="material-symbols-outlined">lab_profile</span> 
                <span class="menu-text">Reports</span>
            </a>
        </li>

        <li class="nav-item">
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="nav-link btn btn-link text-black w-100 d-flex align-items-center gap-2 border-0 bg-transparent">
                    <span class="material-symbols-outlined">exit_to_app</span> 
                    <span class="menu-text">Logout</span>
                </button>
            </form>
        </li>

    </ul>
</div>
        <div id="content" class="p-4">
        {% block content %}{% endblock %}
        </div>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
    }
    </script>
</body>
</html>
