{% load humanize %}
{% load static %}
{% include 'dental/header.html' %}
<body>
  <div class="container modern-container mt-4">
    <div class="card dental-banner mb-4">
      <div class="card-body py-5 px-4">
        <div class="d-flex align-items-center justify-content-between gap-4 flex-column flex-md-row">
          <div>
            <h3 class="mb-2 fw-bold banner-title h3">MHO Burauen Dental Center</h3>
            <div class="subtitle banner-subtitle">PhilHealth CF1 / CF2 / CSF Claim Form</div>
          </div>
          <div class="banner-icon shadow-sm">
            <i class="fa-solid fa-tooth fa-2x"></i>
          </div>
        </div>
      </div>
    </div>
    <div class="viewer-actions mb-4">
      <ul class="nav nav-pills" id="pdfTabNav">
      </ul>
      <button class="btn btn-back-modern"
              onclick="window.location.href = '/dental'">
        <i class="fa-solid fa-arrow-left me-1"></i> Back
      </button>
    </div>
    <div class="viewer-card">
      <div class="card-body">
        <div class="tab-content" id="pdfTabContent"></div>
      </div>
    </div>
  </div>
  <style>
      /* Modern Container */
      .modern-container {
        max-width: 1300px;
        margin: auto;
        padding-top: 20px;
        padding-bottom: 20px;
      }


      .header-icon-right {
        font-size: 2.15rem;
        color: rgba(255, 255, 255, 0.9);
      }

      .viewer-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .btn-back-modern {
        background-color: #6c757d;
        border-color: #6c757d;
        border-radius: 12px;
        font-weight: 600;
        color: white;
        padding: 10px 18px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      }

      .btn-back-modern:hover {
        background-color: #5a6268;
        border-color: #5a6268;
        color: white;
      }

      .viewer-card {
        background: var(--color-surface);
        border: none;
        border-radius: 18px;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }

      .viewer-card .card-body {
        padding: 22px;
      }

      .tab-content {
        min-height: 65vh;
      }

      .tab-pane {
        display: none;
      }

      .tab-pane.active,
      .tab-pane.show {
        display: block;
      }

      .pdf-frame {
        width: 100%;
        min-height: 75vh;
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08);
      }
  </style>
  <style>
      /* Base font and color */
      #printArea {
        font-family: Arial, sans-serif;
        font-size: 10px;
        color: #000;
        line-height: 1.2;
      }

      /* Headings */
      h1,
      h2,
      h3 {
        margin: 3px 0;
        font-weight: bold;
        text-align: center;
      }

      h2 {
        font-size: 14px;
      }
      h3 {
        font-size: 12px;
      }

      /* Paragraph */
      p {
        margin: 2px 0;
        text-align: center;
        font-size: 11px;
      }

      /* Header layout */
      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-top img {
        height: 65px;
        width: auto;
      }

      .header-title {
        flex: 1;
        text-align: center;
        font-size: 14px;
      }

      .header-ref {
        text-align: right;
        font-size: 12px;
        margin-top: 25px;
      }

      /* Info section */
      .info {
        display: flex;
        justify-content: space-between;
        margin-top: 5px;
      }

      .info-column {
        width: 50%;
      }

      .info-row {
        display: flex;
        margin-bottom: 3px;
      }

      .info-row strong {
        width: 40%;
        font-size: 11px;
        white-space: nowrap;
      }

      .value {
        width: 55%;
        font-size: 11px;
      }

      .line-value {
        display: block;
        width: 100%;
        border-bottom: 1px solid #000;
        padding: 2px 0;
        min-height: 16px; /* keeps line visible even if empty */
      }
      /* Tables */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
        font-size: 10px;
      }

      th,
      td {
        border: 1px solid #000;
        padding: 3px;
      }

      th {
        background: #f2f2f2;
        font-size: 10px;
        text-align: center;
      }

      .right {
        text-align: right;
      }

      /* 🔥 Show ONLY when printing */
      @media print {
        body * {
          visibility: hidden;
        }

        #printArea,
        #printArea * {
          visibility: visible;
        }

        #printArea {
          display: block;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
        }

        .signature-section {
          display: flex;
          justify-content: space-between;
          margin-top: 50px;
        }

        .signature-box {
          width: 45%;
          text-align: left;
        }

        .line {
          border-bottom: 1px solid #000;
          margin-top: 25px;
          margin-bottom: 5px;
        }

        /* GRID LAYOUT */
        .signature-details {
          display: grid;
          grid-template-columns: 1fr 1fr;
          column-gap: 20px;
          row-gap: 4px;
          font-size: 11px;
        }

        .signature-details p {
          margin: 0;
          text-align: left;
        }

        /* FULL WIDTH (for name + signature label) */
        .signature-details .full {
          grid-column: 1 / -1;
        }
      }
  </style>
  <script id="pdf-files-data" type="application/json">{{ pdf_files_json|safe }}</script>
  <script>
            // ====== Receive data from backend (DO NOT ALTER) ======
            const pdfFiles = JSON.parse(document.getElementById('pdf-files-data').textContent);
           
            // DOM elements
            const tabNav = document.getElementById("pdfTabNav");
            const tabContent = document.getElementById("pdfTabContent");

            // ====== Create SOA tab ======
            // COMMENTED OUT - SOA functionality removed
            /*
            tabNav.innerHTML += `
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="soa-tab-tab" data-bs-toggle="tab" data-bs-target="#soa-tab" type="button" role="tab">
                  Statement of Account
                </button>
              </li>
            `;
            */

            // COMMENTED OUT - SOA tab content removed
            /*
            tabContent.innerHTML += `
              <div class="tab-pane fade show active" id="soa-tab" role="tabpanel">
                  <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-secondary" id="printSOABtn">
          <i class="fa-solid fa-print me-1"></i> Print
        </button>
      </div>
                ${document.getElementById('printArea').outerHTML}
              </div>
            `;
            */

            // ====== Create other PDF tabs dynamically ======
            pdfFiles.forEach((file, index) => {
              const tabId = `tab-${index}`;
              const isActive = index === 0 ? 'active' : '';
              const isPaneActive = index === 0 ? 'show active' : '';

              tabNav.innerHTML += `
                <li class="nav-item" role="presentation">
                  <button class="nav-link dental-pdf-tab ${isActive}" id="${tabId}-tab" data-bs-toggle="tab" data-bs-target="#${tabId}" type="button" role="tab">
                    ${file.name}
                  </button>
                </li>
              `;

              tabContent.innerHTML += `
                <div class="tab-pane fade ${isPaneActive}" id="${tabId}" role="tabpanel">
                  <iframe class="pdf-frame" src="${file.url}"></iframe>
                </div>
              `;
            });

            // ===== Print Function (DO NOT ALTER) =====
            function printPDF(filePath) {
                const printWin = window.open(filePath);
                printWin.focus();
                printWin.print();
            }
           // COMMENTED OUT - SOA print button functionality removed
           /*
           document.getElementById('printSOABtn').addEventListener('click', function() {
              window.print(); // only runs when button is clicked
          });
           */
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</div>
</html>
