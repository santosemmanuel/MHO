{% include 'animal_bite/header.html' %}

<div class="container" style="width: 100%">
  <div class="card rounded-0 my-3">
    <div class="card-body">
      <div class="d-flex align-items-center">
        <div>
          <h3 class="mb-0" style="color: #009e60">
            MHO Burauen Animal Bite Treatment Center
          </h3>
          <div class="subtitle">PhilHealth CF1 / CF2 / CSF Claim Form</div>
        </div>
      </div>
      <i class="fa-solid fa-dog header-icon-right"></i>
    </div>
  </div>
  <div class="card rounded-0">
    <div class="card-body p-4">
      <form id="philhealthForm" class="needs-validation" novalidate>
      <div class="row g-4">

        <!-- Part I -->
        <div class="col-12">
          <h5 class="mt-2">Member Information</h5>
          <div class="row g-2">
            <div class="col-md-2">
              <label class="form-label">PIN</label>
              <input type="text" class="form-control form-control-sm rounded-0" name="pin" required />
            </div>

            <div class="col-md-3">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control form-control-sm rounded-0" name="lastName" required />
            </div>

            <div class="col-md-3">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control form-control-sm rounded-0" name="firstName" required />
            </div>

            <div class="col-md-3">
              <label class="form-label">Middle Name</label>
              <input type="text" class="form-control form-control-sm rounded-0" name="middleName" />
            </div>

            <div class="col-md-1">
              <label class="form-label">Ext.</label>
              <select class="form-select form-select-sm rounded-0 form-select form-select-sm rounded-0-sm" name="nameExt">
                <option value="">N/A</option>
                <option>Jr.</option>
                <option>Sr.</option>
                <option>II</option>
                <option>III</option>
                <option>IV</option>
              </select>
            </div>

            <div class="col-md-2">
              <label class="form-label">Date of Birth</label>
              <input type="date" class="form-control form-control-sm rounded-0" name="dob" required />
            </div>

            <div class="col-md-2">
              <label class="form-label">Sex</label>
              <select class="form-select form-select-sm rounded-0 form-select form-select-sm rounded-0-sm" name="sex" required>
                <option value="">Select...</option>
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>

            <div class="col-md-4 offset-md-1">
              <label class="form-label">
              Is the patient the member?
              </label>
            <div>
              <label>
                <input
                  type="radio"
                  name="patientIsMember"
                  value="yes"
                  checked
                />
                Self
              </label>

              <label class="ms-3">
                <input type="radio" name="patientIsMember" value="no" />
                Dependent
              </label>
            </div>
          </div>

         
          </div>

          <h5 class="mt-4">Address Details</h5>

          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label">Street</label>
              <input
                class="form-control form-control-sm rounded-0"
                name="street"
                placeholder="Street / Subdivision / Village"
              />
            </div>

            <div class="col-md-4">
              <label class="form-label">Municipality</label>
              <select
                class="form-select form-select-sm rounded-0 form-select form-select-sm rounded-0-sm"
                id="municipality"
                name="municipality"
                required
              >
                <option value="">Choose Municipality...</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Barangay</label>
              <select
                class="form-select form-select-sm rounded-0 form-select form-select-sm rounded-0-sm"
                name="barangay"
                id="barangay"
                required
              >
                <option value="">Choose Barangay...</option>
              </select>
            </div>
          </div>

          <h5 class="mt-4">Contact Information</h5>

          <div class="row g-2">
            <div class="col-md-6">
               <label class="form-label">
                Contact Number
              </label>
              <input
                class="form-control form-control-sm rounded-0"
                name="mobile"
                placeholder="Mobile No. (e.g., 09xxxxxxxxx)"
              />
            </div>

            <div class="col-md-6">
               <label class="form-label">
                Email Address
              </label>
              <input
                class="form-control form-control-sm rounded-0"
                name="email"
                placeholder="Email Address"
              />
            </div>
          </div>
        </div>

        <!-- Part II -->
        <div class="col-12 mt-4">

          

          <div id="dependentSection" class="row g-2">
            <div class="col-12">
              <h5>Dependent Info</h5>
            </div>

            <div class="col-md-12">
              <label class="form-label">Dependent PIN</label>
              <input type="text" class="form-control form-control-sm rounded-0" name="depPin" />
            </div>

            <div class="col-md-6">
              <input
                class="form-control form-control-sm rounded-0"
                name="depLname"
                placeholder="Last Name"
              />
            </div>

            <div class="col-md-6">
              <input
                class="form-control form-control-sm rounded-0"
                name="depFname"
                placeholder="First Name"
              />
            </div>

            <div class="col-md-4">
              <input
                class="form-control form-control-sm rounded-0"
                name="depMname"
                placeholder="Middle Name"
              />
            </div>

            <div class="col-md-4">
              <select class="form-select form-select-sm rounded-0" name="depExt">
                <option value="">Ext</option>
                <option>Jr.</option>
                <option>Sr.</option>
                <option>II</option>
                <option>III</option>
                <option>IV</option>
              </select>
            </div>

            <div class="col-md-4">
              <select class="form-select form-select-sm rounded-0" name="depSex">
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">D.O.B</label>
              <input type="date" class="form-control form-control-sm rounded-0" name="depDob" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Relationship to Member</label>
              <select class="form-select form-select-sm rounded-0" name="relationship">
                <option>Child</option>
                <option>Parent</option>
                <option>Spouse</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Part III -->
        <div class="col-12 mt-4">
  <label class="form-label fw-bold">Form Signee</label>
          <div class="row">
              
            <div class="col-md-4">
                <input
                  type="radio"
                  id="radioMember"
                  name="signee"
      
                  value="member"
                  checked
                />
                <label class="form-check-label" for="radioMember">
                  Member
                </label>
   

                <input
                  type="radio"
                  id="radioRep"
                  name="signee"

                  value="representative"
                />
                <label class="form-check-label" for="radioRep">
                  Representative
                </label>
            </div>
            <div id="representativeSection" class="col-md-6 g-2">
       
<div class="row">
            <div class="col-md-4">
              <input
                class="form-control form-control-sm rounded-0"
                name="repName"
                placeholder="Representative Full Name"
              />
            </div>

            <div class="col-md-4">
              <select class="form-select form-select-sm rounded-0" name="repRelationship">
                <option value="">Relationship</option>
                <option>Spouse</option>
                <option>Child</option>
                <option>Parent</option>
                <option>Sibling</option>
                <option>Others</option>
              </select>
            </div>

            <div class="col-md-4">
              <select class="form-select form-select-sm rounded-0" name="repReason">
                <option value="">Reason for Representation</option>
                <option>Member is incapacitated</option>
                <option>Others</option>
              </select>
            </div>
          </div>
          </div>
</div>

        </div>
          
      </div>
      <button
            class="btn btn-light"
            style="
              background-color: #009e60;
              border-color: #009e60;
              color: #ffff;
              font-weight: bold;
            "
          >
            Submit Claim Form
          </button>
      </form>
    </div>
  </div>
</div>

{% include 'animal_bite/footer.html' %}
