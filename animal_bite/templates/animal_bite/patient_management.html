{% load static %}
{% include 'animal_bite/header.html' %}
{% csrf_token %}
<div class="container-xl animal-bite-page my-5">
    <div class="card animal-bite-banner mb-4">
        <div class="card-body py-5 px-4">
            <div class="d-flex align-items-center justify-content-between gap-4 flex-column flex-md-row">
                <div>
                    <h3 class="mb-2 fw-bold banner-title">
                        <i class="fa-solid fa-file-chart-line me-2"></i>Patient Management Section
                    </h3>
                    <div class="subtitle banner-subtitle">Animal Bite Management System - Patient Overview</div>
                </div>
                <div class="banner-icon shadow-sm">
                    <i class="fa-solid fa-chart-bar fa-2x"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4 mb-4">
        <!-- Recent Claims -->
             <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Date</label>
            <input type="date"
                   class="form-control"
                   id="dateFilter"
                   value="{{ today|date:'Y-m-d' }}"
                   name="dateFilter">
          </div>
          <div class="col-md-3">
            <label class="form-label">Barangay</label>
            <select class="form-select" id="barangayFilter">
              <option value="">All Barangays</option>
            </select>
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-submit w-100" id="applyFilterBtn">
              <i class="fa-solid fa-filter me-2"></i>
              Apply Filter
            </button>
          </div>
        </div>
      </div>
    </div>
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white d-flex justify-content-between">
                <strong>
                    <i class="fa-solid fa-table me-2"></i>
                    Recent Claims
                </strong>
                <button id="printSummaryBtn" class="btn btn-submit btn-sm">
                    <i class="fa-solid fa-print me-2"></i>
                    Print Summary
                </button>
            </div>
            <div class="card-body">
                <table id="example" class="table table-striped">
                    <thead>
                        <tr>
                            <th style="width: 20%">PIN</th>
                            <th style="width: 30%">Name</th>
                            <th>Membership</th>
                            <th>Barangay</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit modal -->
        <!-- Edit Record Modal -->
        <div class="modal fade" id="editRecordModal" tabindex="-1" aria-labelledby="editRecordModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title" id="editRecordModalLabel">
                            <i class="fa-solid fa-pen-to-square me-2"></i>
                            Edit Member Information
                        </h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close">
                        </button>
                    </div>

                    <form id="editRecordForm">

                        <div class="modal-body">

                            <!-- Hidden ID -->
                            <input type="hidden" id="edit_id">

                            <div class="row g-3">

                                <!-- PIN -->
                                <div class="col-md-6">
                                    <label for="edit_pin" class="form-label">
                                        PIN
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="edit_pin"
                                        name="pin"
                                        readonly>
                                </div>

                                <!-- Membership -->
                                <div class="col-md-6">
                                    <label for="edit_membership" class="form-label">
                                        Membership
                                    </label>

                                    <select class="form-select"
                                            id="edit_membership"
                                            name="membership">

                                        <option value="MEMBER">MEMBER</option>
                                        <option value="DEPENDENT">DEPENDENT</option>

                                    </select>
                                </div>

                                <!-- Last Name -->
                                <div class="col-md-6">
                                    <label for="edit_last_name" class="form-label">
                                        Last Name
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="edit_last_name"
                                        name="last_name"
                                        required>
                                </div>

                                <!-- First Name -->
                                <div class="col-md-6">
                                    <label for="edit_first_name" class="form-label">
                                        First Name
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="edit_first_name"
                                        name="first_name"
                                        required>
                                </div>

                                <!-- Middle Name -->
                                <div class="col-md-6">
                                    <label for="edit_middle_name" class="form-label">
                                        Middle Name
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="edit_middle_name"
                                        name="middle_name">
                                </div>

                                <!-- Name Extension -->
                                <div class="col-md-6">
                                    <label for="edit_name_ext" class="form-label">
                                        Name Extension
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="edit_name_ext"
                                        name="name_ext"
                                        placeholder="Jr., Sr., III, etc.">
                                </div>

                                <!-- Barangay -->
                                <div class="col-md-6">
                                    <label for="edit_barangay" class="form-label">
                                        Barangay
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        id="edit_barangay"
                                        name="barangay"
                                        required>
                                </div>

                            </div>

                        </div>

                        <div class="modal-footer">

                            <button type="button"
                                    class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                <i class="fa-solid fa-xmark me-1"></i>
                                Cancel
                            </button>

                            <button type="submit"
                                    class="btn btn-submit">
                                <i class="fa-solid fa-floppy-disk me-1"></i>
                                Save Changes
                            </button>

                        </div>

                    </form>

                </div>
            </div>
        </div>
    <!--- End Edit Modal -->
    <script>
     const today = new Date();

    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');

    //const todayString = `${year}-${month}-${day}`;
    const todayString = ``;

    fetch(`{% url 'animal_bite:patient_records' %}?date=${encodeURIComponent(todayString)}`)
      .then((response) => response.json())
      .then((data) => {

        const tbody = document.querySelector('#example tbody');
        tbody.innerHTML = '';

        data.forEach(item => {
            const row = `
                <tr>
                    <td>${item.pin}</td>

                    <td>
                        ${item.last_name}, 
                        ${item.first_name} 
                        ${item.middle_name || ""} 
                        ${item.name_ext || ""}
                    </td>

                    <td>${item.membership}</td>

                    <td>${item.barangay}</td>

                    <td>
                        <div class="dropdown">

                            <button 
                                class="btn btn-submit w-100 dropdown-toggle" 
                                type="button" 
                                data-bs-toggle="dropdown" 
                                aria-expanded="false">

                                <i class="fa-solid fa-ellipsis me-2"></i>
                                Actions

                            </button>

                            <ul class="dropdown-menu">

                                <li>
                                    <a class="dropdown-item generate-pdf-btn"
                                    href="#"
                                    data-pin="${item.pin}">

                                        <i class="fa-solid fa-file-pdf me-2"></i>
                                        Generate PDF

                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item edit-btn"
                                    href="#"
                                    data-id="${item.id}">

                                        <i class="fa-solid fa-edit me-2"></i>
                                        Edit

                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item delete-btn"
                                    href="#"
                                    data-id="${item.id}">
                                        <i class="fa-solid fa-trash me-2"></i>
                                        Delete
                                    </a>
                                </li>

                            </ul>

                        </div>
                    </td>
                </tr>
            `;

            tbody.insertAdjacentHTML("beforeend", row);
        });

        new DataTable('#example');

        // Edit Function 
    document.addEventListener("click", function (e) {

        const editButton = e.target.closest(".edit-btn");

        if (!editButton) return;

        e.preventDefault();

        const id = editButton.dataset.id;

        editRecord(id);
    });

    function editRecord(id) {

        console.log("Editing record ID:", id);

        // Find the record from your existing data array
        const item = data.find(record => record.id == id);

        if (!item) {
            Swal.fire({
                icon: "error",
                title: "Record Not Found",
                text: "The selected record could not be found."
            });

            return;
        }

        // Populate modal fields
        document.getElementById("edit_id").value = item.id || "";
        document.getElementById("edit_pin").value = item.pin || "";

        document.getElementById("edit_last_name").value =
            item.last_name || "";

        document.getElementById("edit_first_name").value =
            item.first_name || "";

        document.getElementById("edit_middle_name").value =
            item.middle_name || "";

        document.getElementById("edit_name_ext").value =
            item.name_ext || "";

        document.getElementById("edit_membership").value =
            item.membership || "";

        document.getElementById("edit_barangay").value =
            item.barangay || "";

        // Open Bootstrap modal
        const modalElement = document.getElementById("editRecordModal");

        const modal = bootstrap.Modal.getOrCreateInstance(modalElement);

        modal.show();
    }

    }); 

    document.addEventListener("click", function (e) {

        const deleteButton = e.target.closest(".delete-btn");

        if (!deleteButton) return;

        e.preventDefault();

        const id = deleteButton.dataset.id;

        deleteRecord(id);
    });


    function getCSRFToken() {

        const cookieValue = document.cookie
            .split("; ")
            .find(row => row.startsWith("csrftoken="));

        return cookieValue
            ? decodeURIComponent(cookieValue.split("=")[1])
            : "";
    }

    async function deleteRecord(id) {

        const result = await Swal.fire({
            title: "Delete Record?",
            text: "This record will be permanently deleted.",
            icon: "warning",

            showCancelButton: true,

            confirmButtonText: "Yes, Delete",
            cancelButtonText: "Cancel",

            confirmButtonColor: "#dc3545",
            cancelButtonColor: "#6c757d"
        });

        // User clicked Cancel
        if (!result.isConfirmed) {
            return;
        }

        try {
            const deleteUrl = "{% url 'animal_bite:delete_member' 0 %}"
            .replace("/0/", "/" + id + "/");

            const response = await fetch(deleteUrl, {
                method: "POST",

                headers: {
                    "X-CSRFToken": getCSRFToken(),
                    "Content-Type": "application/json"
                }
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message || "Failed to delete record."
                );
            }

            await Swal.fire({
                icon: "success",
                title: "Deleted!",  
                text: "The record has been deleted successfully.",
                timer: 1500,
                showConfirmButton: false
            });

            // Reload table
            window.location.reload();

        } catch (error) {

            console.error("Delete error:", error);

            Swal.fire({
                icon: "error",
                title: "Delete Failed",
                text: error.message
            });
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% include 'animal_bite/footer.html' %}
